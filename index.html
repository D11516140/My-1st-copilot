<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-labelledby="page-title">
      <header class="app-header">
        <div class="title-row">
          <div>
            <p class="eyebrow">MY TASKS</p>
            <h1 id="page-title">待辦清單</h1>
          </div>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切換為深色模式">
            <span class="theme-icon" aria-hidden="true">🌙</span>
            <span class="theme-label">深色模式</span>
          </button>
        </div>
        <p class="subtitle">把今天要完成的事情，一件一件做好。</p>
      </header>

      <form id="todo-form" class="todo-form">
        <label class="sr-only" for="todo-input">新增待辦事項</label>
        <input
          id="todo-input"
          name="todo"
          type="text"
          placeholder="今天想完成什麼？"
          autocomplete="off"
          maxlength="120"
        >
        <button type="submit" class="add-button">新增</button>
      </form>

      <nav class="filter-tabs" aria-label="待辦篩選">
        <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">全部</button>
        <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
        <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
      </nav>

      <p id="empty-state" class="empty-state" hidden>還沒有任何待辦事項，新增一個吧!</p>
      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <footer class="todo-footer">
        <span id="todo-count">未完成: 0 項</span>
      </footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
